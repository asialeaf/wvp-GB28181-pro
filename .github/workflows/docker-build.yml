name: Docker Build

on:
  push:
    branches:
      - dev_asialeaf # 推送到 dev_asialeaf 分支时触发
  workflow_dispatch: # 允许手动触发

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clean Maven cache
        run: rm -rf ~/.m2/repository/io/github/git-commit-id

      - name: Build Backend
        run: |
          mvn clean package -DskipTests

      - name: View target directory
        run: |
          echo "=== Target directory structure ==="
          ls -lah target/ || echo "target directory not found"
          echo ""
          echo "=== JAR files in target ==="
          ls -lh target/*.jar 2>/dev/null || echo "No JAR files found"
          echo ""
          echo "=== Target directory size ==="
          du -sh target/ 2>/dev/null || echo "Cannot calculate size"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Dockerfile
        run: |
          cat > Dockerfile.tmp << 'EOF'
          FROM eclipse-temurin:21-jre-jammy
          
          WORKDIR /app
          
          # 复制 JAR 文件
          COPY target/*.jar app.jar
          
          # 复制配置文件
          COPY docker/wvp/wvp ./
          
          # 暴露端口
          EXPOSE 18978/tcp
          EXPOSE 8116/tcp
          EXPOSE 8116/udp
          EXPOSE 8080/tcp
          
          ENTRYPOINT ["java", "-Xms512m", "-Xmx1024m", "-XX:+HeapDumpOnOutOfMemoryError", "-XX:HeapDumpPath=/opt/ylcx/", "-jar", "app.jar", "--spring.config.location=/app/application.yml"]
          EOF
          cat Dockerfile.tmp

      - name: Extract tag name
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="latest"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Tag name: $TAG_NAME"

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.tmp
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/wvp-pro:${{ steps.tag.outputs.tag }}
            ${{ secrets.DOCKER_USERNAME }}/wvp-pro:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/wvp-pro:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/wvp-pro:buildcache,mode=max
          platforms: linux/amd64

